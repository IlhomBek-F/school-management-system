<school-form-tabs defaultValue="basic_info" [tabItems]="tabItems"/>

<footer class="flex justify-end gap-3 mt-5">
  <button pButton (click)="cancel()" outlined icon="pi pi-times-circle">cancel</button>
  <button pButton (click)="confirm()" [disabled]="tabItems[0].form.invalid || tabItems[1].form.invalid || loading()" icon="pi pi-save" label="save" [loading]="loading()"></button>
</footer>
